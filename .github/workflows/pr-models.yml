name: PR model disclosure

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  statuses: write

jobs:
  disclosure:
    name: Publish model disclosure status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check PR description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash .github/scripts/check-pr-models.sh "$GITHUB_EVENT_PATH"; then
            state=success
            description='PR model disclosure is complete'
          else
            state=failure
            description='Add the AI models used and their versions, or None'
          fi

          sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$state" \
            -f context='PR model disclosure' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
