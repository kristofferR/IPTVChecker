name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      ASSET_PLATFORM: ${{ contains(matrix.target, 'apple-darwin') && 'mac' || contains(matrix.target, 'windows') && 'win' || 'lin' }}
      ASSET_ARCH: ${{ startsWith(matrix.target, 'aarch64') && 'arm' || 'x64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Download ffmpeg binaries
        run: bash scripts/download-ffmpeg.sh ${{ matrix.target }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — only used if secrets are configured)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "IPTV Checker ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Keep these aliases stable: kristofferR/homebrew-tap builds asset URLs from them.
          assetNamePattern: "IPTV.Checker_[version]_${{ env.ASSET_PLATFORM }}_${{ env.ASSET_ARCH }}[_setup][ext]"
          args: --target ${{ matrix.target }}

      - name: Verify production binary set
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash scripts/verify-production-binaries.sh "${TARGET_TRIPLE}"

      - name: Harden and replace AppImage release asset
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          appimage="$(bash scripts/find-appimage.sh "${TARGET_TRIPLE}")"
          bash scripts/harden-appimage-runtime.sh "${appimage}"

          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          release_asset="IPTV.Checker_${version}_lin_${ASSET_ARCH}.AppImage"
          cp "${appimage}" "${release_asset}"
          gh release upload "${GITHUB_REF_NAME}" "${release_asset}" --clobber

      - name: Create Windows portable zip
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows')
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}" -match "aarch64") { "arm" } else { "x64" }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $zipName = "IPTV.Checker_${version}_win_${arch}_portable.zip"
          $staging = "portable-staging"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/iptv-checker.exe" "$staging/IPTV Checker.exe"
          Copy-Item "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe" "$staging/ffmpeg.exe"
          Copy-Item "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe" "$staging/ffprobe.exe"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload Windows portable zip
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE_ZIP }}" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured, skipping tap update"
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          REPO="kristofferR/IPTVChecker"
          TAP_REPO="kristofferR/homebrew-tap"

          # Download assets using GITHUB_TOKEN (has access to IPTVChecker repo)
          mkdir -p /tmp/assets
          for asset in \
            "IPTV.Checker_${VERSION}_mac_arm.dmg" \
            "IPTV.Checker_${VERSION}_mac_x64.dmg" \
            "IPTV.Checker_${VERSION}_lin_arm.AppImage" \
            "IPTV.Checker_${VERSION}_lin_x64.AppImage"; do
            GH_TOKEN="$RELEASE_TOKEN" gh release download "$GITHUB_REF_NAME" --repo "$REPO" --pattern "$asset" --dir /tmp/assets
          done

          # Compute SHA256 hashes (fail if any asset is missing)
          SHA_MAC_ARM=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_mac_arm.dmg" | cut -d' ' -f1)
          SHA_MAC_X64=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_mac_x64.dmg" | cut -d' ' -f1)
          SHA_LIN_ARM=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_lin_arm.AppImage" | cut -d' ' -f1)
          SHA_LIN_X64=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_lin_x64.AppImage" | cut -d' ' -f1)

          # Generate updated cask formula
          cat > /tmp/iptv-checker.rb << CASK_EOF
          cask "iptv-checker" do
            version "${VERSION}"

            on_macos do
              on_arm do
                sha256 "${SHA_MAC_ARM}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_mac_arm.dmg",
                    verified: "github.com/${REPO}/"
              end

              on_intel do
                sha256 "${SHA_MAC_X64}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_mac_x64.dmg",
                    verified: "github.com/${REPO}/"
              end
            end

            on_linux do
              on_arm do
                sha256 "${SHA_LIN_ARM}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_lin_arm.AppImage",
                    verified: "github.com/${REPO}/"
              end

              on_intel do
                sha256 "${SHA_LIN_X64}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_lin_x64.AppImage",
                    verified: "github.com/${REPO}/"
              end

              container type: :naked
            end

            name "IPTV Checker"
            desc "Validate IPTV playlists and inspect stream health"
            homepage "https://github.com/${REPO}"

            preflight do
              old_app = Pathname.new("/Applications/IPTV Checker.app")
              next unless old_app.symlink?

              target = old_app.readlink.to_s
              old_app.delete if target.include?("/opt/homebrew/opt/iptv-checker/") || target.include?("/usr/local/opt/iptv-checker/")
            end

            on_macos do
              app "IPTV Checker.app"
            end

            on_linux do
              on_arm do
                binary "IPTV.Checker_#{version}_lin_arm.AppImage", target: "iptv-checker"
              end

              on_intel do
                binary "IPTV.Checker_#{version}_lin_x64.AppImage", target: "iptv-checker"
              end
            end
          end
          CASK_EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/iptv-checker.rb

          # Push to homebrew-tap repo
          CONTENT=$(base64 -w 0 /tmp/iptv-checker.rb)
          EXISTING_SHA=$(gh api "repos/${TAP_REPO}/contents/Casks/iptv-checker.rb" --jq '.sha' 2>/dev/null || echo "")

          gh api --method PUT "repos/${TAP_REPO}/contents/Casks/iptv-checker.rb" \
            -f message="Update IPTV Checker to ${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$EXISTING_SHA" \
            -f branch="main"
