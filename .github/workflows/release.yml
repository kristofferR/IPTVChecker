name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string
      target:
        description: Platform to build (publication still requires every platform)
        type: choice
        default: all
        options:
          - all
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select release targets
        id: matrix
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a stable release tag, such as v2.0.0" >&2; exit 1; }
          matrix=$(jq -cn --arg target "$REQUESTED_TARGET" '
            {include: [
              {os: "macos-latest", target: "aarch64-apple-darwin"},
              {os: "macos-latest", target: "x86_64-apple-darwin"},
              {os: "ubuntu-22.04", target: "x86_64-unknown-linux-gnu"},
              {os: "ubuntu-24.04-arm", target: "aarch64-unknown-linux-gnu"},
              {os: "windows-latest", target: "x86_64-pc-windows-msvc"},
              {os: "windows-latest", target: "aarch64-pc-windows-msvc"}
            ] | map(select($target == "all" or .target == $target))}')
          jq -e '.include | length > 0' <<< "$matrix" >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # Run targets one at a time: tauri-action's updater step downloads the
      # release's latest.json, adds this target's entry, and re-uploads it.
      # Concurrent jobs would clobber each other's entries.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    env:
      ASSET_PLATFORM: ${{ contains(matrix.target, 'apple-darwin') && 'mac' || contains(matrix.target, 'windows') && 'win' || 'lin' }}
      ASSET_ARCH: ${{ startsWith(matrix.target, 'aarch64') && 'arm' || 'x64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Windows post-build cache saving can stall after all assets are uploaded.
          save-if: ${{ !startsWith(matrix.os, 'windows') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Download ffmpeg binaries
        run: bash scripts/download-ffmpeg.sh ${{ matrix.target }}

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — only used if secrets are configured)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing (required for the auto-update artifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "IPTV Checker ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: false
          # Keep these aliases stable: kristofferR/homebrew-tap builds asset URLs from them.
          releaseAssetNamePattern: "IPTV.Checker_[version]_${{ env.ASSET_PLATFORM }}_${{ env.ASSET_ARCH }}[_setup][ext]"
          # The release config enables createUpdaterArtifacts. It is kept out of
          # the base config so a local `tauri build` doesn't need the signing key.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.conf.release.json

      - name: Verify production binary set
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash scripts/verify-production-binaries.sh "${TARGET_TRIPLE}"

      # tauri-action notarizes the .app but not the .dmg, so a downloaded .dmg
      # would still be gatekeeper-prompted. Notarize + staple it, re-upload it
      # under the stable name, and point the updater at it: the .dmg is the
      # artifact users download, so it is the one that should be installed.
      - name: Notarize the .dmg and point the updater at it
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_MAC_ARCH: ${{ startsWith(matrix.target, 'aarch64') && 'aarch64' || 'x64' }}
          UPDATER_PLATFORM: ${{ startsWith(matrix.target, 'aarch64') && 'darwin-aarch64' || 'darwin-x86_64' }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Missing Apple notarization secrets for release ${RELEASE_TAG}." >&2
            exit 1
          fi

          # -print -quit rather than piping to head: under `set -o pipefail` a
          # missing bundle dir makes find fail the whole step before the guard
          # below can report it.
          src="$(find "src-tauri/target/${TARGET_TRIPLE}/release/bundle/dmg" -name '*.dmg' -print -quit || true)"
          if [ -z "${src}" ]; then echo "No .dmg found." >&2; exit 1; fi
          xcrun notarytool submit "${src}" --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
          xcrun stapler staple "${src}"

          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          dest="IPTV.Checker_${version}_mac_${ASSET_ARCH}.dmg"
          cp "${src}" "${dest}"
          bun run tauri signer sign "${dest}"
          gh release upload "${RELEASE_TAG}" "${dest}" "${dest}.sig" --clobber

          bash scripts/patch-updater-manifest.sh \
            "${RELEASE_TAG}" "${UPDATER_PLATFORM}" "app" "${dest}" "$(cat "${dest}.sig")"

          # Drop the stock .app.tar.gz updater archive: latest.json now points
          # at the stapled .dmg, so the archive would only confuse the release
          # listing (and is not notarized).
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            | jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' | head -n1)"
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate)"
          for stale in \
            "IPTV.Checker_${version}_${TAURI_MAC_ARCH}.app.tar.gz" \
            "IPTV.Checker_${version}_${TAURI_MAC_ARCH}.app.tar.gz.sig" \
            "IPTV.Checker_${version}_mac_${ASSET_ARCH}.app.tar.gz" \
            "IPTV.Checker_${version}_mac_${ASSET_ARCH}.app.tar.gz.sig" \
            "IPTV.Checker_${version}_${TAURI_MAC_ARCH}.dmg"; do
            stale_id="$(printf '%s\n' "${assets}" \
              | jq -r --arg name "${stale}" '.[] | select(.name == $name) | .id' | head -n1)"
            if [ -n "${stale_id}" ]; then
              echo "Deleting superseded asset ${stale}."
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${stale_id}"
            fi
          done

      - name: Harden and replace AppImage release asset
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PLATFORM: ${{ startsWith(matrix.target, 'aarch64') && 'linux-aarch64' || 'linux-x86_64' }}
        run: |
          appimage="$(bash scripts/find-appimage.sh "${TARGET_TRIPLE}")"
          bash scripts/harden-appimage-runtime.sh "${appimage}"

          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          release_asset="IPTV.Checker_${version}_lin_${ASSET_ARCH}.AppImage"
          cp "${appimage}" "${release_asset}"
          gh release upload "${RELEASE_TAG}" "${release_asset}" --clobber

          # Hardening rewrites the AppImage after tauri-action signed it, so the
          # signature already in latest.json does not match the published bytes.
          # Re-sign the hardened file and repoint the manifest, or every Linux
          # auto-update would fail minisign verification.
          bun run tauri signer sign "${release_asset}"
          # Replace the stale detached signature asset too, so anyone verifying
          # the published AppImage by hand gets the matching one.
          gh release upload "${RELEASE_TAG}" "${release_asset}.sig" --clobber
          bash scripts/patch-updater-manifest.sh \
            "${RELEASE_TAG}" "${UPDATER_PLATFORM}" "appimage" \
            "${release_asset}" "$(cat "${release_asset}.sig")"

      - name: Create Windows portable zip
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows')
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}" -match "aarch64") { "arm" } else { "x64" }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $zipName = "IPTV.Checker_${version}_win_${arch}_portable.zip"
          $staging = "portable-staging"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/iptv-checker.exe" "$staging/IPTV Checker.exe"
          Copy-Item "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe" "$staging/ffmpeg.exe"
          Copy-Item "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe" "$staging/ffprobe.exe"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Scan Windows release artifacts with Microsoft Defender
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows')
        shell: pwsh
        run: |
          $targetRoot = "src-tauri/target/${{ matrix.target }}/release"
          $installers = @(Get-ChildItem "$targetRoot/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }

          $scanPaths = @(
            $installers[0].FullName
            (Resolve-Path $env:PORTABLE_ZIP).Path
            (Resolve-Path "$targetRoot/iptv-checker.exe").Path
            (Resolve-Path "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe").Path
            (Resolve-Path "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe").Path
          )
          & scripts/scan-windows-defender.ps1 -Paths $scanPaths

      - name: Upload Windows portable zip
        if: startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ env.PORTABLE_ZIP }}" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify the complete release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length == 1' "$RUNNER_TEMP/releases.json" >/dev/null
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          for arch in arm x64; do
            for suffix in \
              "mac_$arch.dmg" "mac_$arch.dmg.sig" \
              "lin_$arch.AppImage" "lin_$arch.AppImage.sig" \
              "lin_$arch.deb" "lin_$arch.deb.sig" \
              "lin_$arch.rpm" "lin_$arch.rpm.sig" \
              "win_${arch}_setup.exe" "win_${arch}_setup.exe.sig" "win_${arch}_portable.zip"; do
              name="IPTV.Checker_${version}_$suffix"
              jq -e --arg name "$name" '.assets | any(.name == $name and .size > 0)' "$RUNNER_TEMP/release-assets.json" >/dev/null || { echo "Missing release asset: $name" >&2; exit 1; }
            done
          done
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/release-manifest"
          manifest="$RUNNER_TEMP/release-manifest/latest.json"
          jq -e --arg version "$version" '.version == $version' "$manifest" >/dev/null
          for platform in darwin-aarch64 darwin-x86_64 linux-aarch64 linux-x86_64 windows-aarch64 windows-x86_64; do
            case "$platform" in darwin-*) installer=app ;; linux-*) installer=appimage ;; windows-*) installer=nsis ;; esac
            for key in "$platform" "$platform-$installer"; do
              jq -e --arg key "$key" --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
                .platforms[$key] as $entry |
                ($entry.signature | type == "string" and length > 0) and
                ($assets[0].assets | any(.apiUrl == $entry.url or .url == $entry.url))
              ' "$manifest" >/dev/null || { echo "Invalid updater entry: $key" >&2; exit 1; }
            done
          done

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ env.RELEASE_TAG }}" --draft=false --repo ${{ github.repository }}

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured, skipping tap update"
            exit 0
          fi

          VERSION="${RELEASE_TAG#v}"
          REPO="kristofferR/IPTVChecker"
          TAP_REPO="kristofferR/homebrew-tap"

          # Download assets using GITHUB_TOKEN (has access to IPTVChecker repo)
          mkdir -p /tmp/assets
          for asset in \
            "IPTV.Checker_${VERSION}_mac_arm.dmg" \
            "IPTV.Checker_${VERSION}_mac_x64.dmg" \
            "IPTV.Checker_${VERSION}_lin_arm.AppImage" \
            "IPTV.Checker_${VERSION}_lin_x64.AppImage"; do
            GH_TOKEN="$RELEASE_TOKEN" gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "$asset" --dir /tmp/assets
          done

          # Compute SHA256 hashes (fail if any asset is missing)
          SHA_MAC_ARM=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_mac_arm.dmg" | cut -d' ' -f1)
          SHA_MAC_X64=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_mac_x64.dmg" | cut -d' ' -f1)
          SHA_LIN_ARM=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_lin_arm.AppImage" | cut -d' ' -f1)
          SHA_LIN_X64=$(sha256sum "/tmp/assets/IPTV.Checker_${VERSION}_lin_x64.AppImage" | cut -d' ' -f1)

          # Generate updated cask formula
          cat > /tmp/iptv-checker.rb << CASK_EOF
          cask "iptv-checker" do
            version "${VERSION}"

            on_macos do
              on_arm do
                sha256 "${SHA_MAC_ARM}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_mac_arm.dmg",
                    verified: "github.com/${REPO}/"
              end

              on_intel do
                sha256 "${SHA_MAC_X64}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_mac_x64.dmg",
                    verified: "github.com/${REPO}/"
              end
            end

            on_linux do
              on_arm do
                sha256 "${SHA_LIN_ARM}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_lin_arm.AppImage",
                    verified: "github.com/${REPO}/"
              end

              on_intel do
                sha256 "${SHA_LIN_X64}"

                url "https://github.com/${REPO}/releases/download/v#{version}/IPTV.Checker_#{version}_lin_x64.AppImage",
                    verified: "github.com/${REPO}/"
              end

              container type: :naked
            end

            name "IPTV Checker"
            desc "Validate IPTV playlists and inspect stream health"
            homepage "https://github.com/${REPO}"

            # The app ships a signed in-app updater, so a cask-installed copy can
            # update itself between \`brew upgrade\` runs.
            auto_updates true

            preflight do
              old_app = Pathname.new("/Applications/IPTV Checker.app")
              next unless old_app.symlink?

              target = old_app.readlink.to_s
              old_app.delete if target.include?("/opt/homebrew/opt/iptv-checker/") || target.include?("/usr/local/opt/iptv-checker/")
            end

            on_macos do
              app "IPTV Checker.app"
            end

            on_linux do
              on_arm do
                binary "IPTV.Checker_#{version}_lin_arm.AppImage", target: "iptv-checker"
              end

              on_intel do
                binary "IPTV.Checker_#{version}_lin_x64.AppImage", target: "iptv-checker"
              end
            end
          end
          CASK_EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/iptv-checker.rb

          # Push to homebrew-tap repo
          CONTENT=$(base64 -w 0 /tmp/iptv-checker.rb)
          EXISTING_SHA=$(gh api "repos/${TAP_REPO}/contents/Casks/iptv-checker.rb" --jq '.sha' 2>/dev/null || echo "")

          gh api --method PUT "repos/${TAP_REPO}/contents/Casks/iptv-checker.rb" \
            -f message="Update IPTV Checker to ${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$EXISTING_SHA" \
            -f branch="main"

  aur:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        if: env.HAS_AUR_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Generate PKGBUILD from template
        if: env.HAS_AUR_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p /tmp/aur
          gh release download "${RELEASE_TAG}" --pattern "IPTV.Checker_${VERSION}_lin_x64.deb" --dir /tmp/aur
          gh release download "${RELEASE_TAG}" --pattern "IPTV.Checker_${VERSION}_lin_arm.deb" --dir /tmp/aur

          SHA_X64=$(sha256sum "/tmp/aur/IPTV.Checker_${VERSION}_lin_x64.deb" | cut -d' ' -f1)
          SHA_ARM=$(sha256sum "/tmp/aur/IPTV.Checker_${VERSION}_lin_arm.deb" | cut -d' ' -f1)
          SHA_LICENSE=$(sha256sum LICENSE | cut -d' ' -f1)

          # Must land inside the workspace: the deploy action below runs in a
          # Docker container that only gets the workspace mounted, not /tmp.
          mkdir -p aur
          sed -e "s/@PKGVER@/${VERSION}/" \
              -e "s/@SHA_LICENSE@/${SHA_LICENSE}/" \
              -e "s/@SHA_X64@/${SHA_X64}/" \
              -e "s/@SHA_ARM@/${SHA_ARM}/" \
              packaging/aur/PKGBUILD.tpl > aur/PKGBUILD

      - name: Publish to AUR
        if: env.HAS_AUR_KEY == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: iptv-checker-gui
          pkgbuild: ./aur/PKGBUILD
          test: true
          commit_username: kristofferR
          commit_email: 481270+kristofferR@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.RELEASE_TAG }}"

      - name: Skip notice
        if: env.HAS_AUR_KEY != 'true'
        run: echo "AUR_SSH_PRIVATE_KEY not configured, skipping AUR publish"
