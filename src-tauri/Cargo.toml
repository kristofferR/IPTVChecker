[package]
name = "iptv-checker"
version = "1.3.1"
description = "Cross-platform IPTV Stream Checker"
authors = []
edition = "2021"
default-run = "iptv-checker"

[lib]
name = "iptv_checker_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "socks", "cookies"] }
url = "2"
regex = "1"
fancy-regex = "0.17"
csv = "1"
futures = "0.3"
thiserror = "2"
rand = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
base64 = "0.22.1"
sha2 = "0.10"
tauri-plugin-notification = "2"
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", features = ["devtools"] }
fs2 = "0.4.3"
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-macos-haptics = "1.0.0"
objc2 = "0.6.4"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
strip = true
