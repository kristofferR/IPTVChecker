[package]
name = "iptv-checker"
version = "1.7.0"
description = "Cross-platform IPTV Stream Checker"
authors = []
edition = "2021"
default-run = "iptv-checker"

[lib]
name = "iptv_checker_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "socks", "cookies"] }
url = "2"
regex = "1"
fancy-regex = "0.17"
csv = "1"
futures = "0.3"
thiserror = "2"
rand = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
base64 = "0.22.1"
sha2 = "0.10"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# rev-pinned: the fuzz crate resolves this git dep independently of the main
# Cargo.lock, and upstream's newer revisions pull xcap 0.9+ (pipewire system
# libs), which broke the fuzz CI job. Bump the rev deliberately, not implicitly.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "ac709a71d30ac2f167dd79c4f803500a236262f6", features = ["devtools"] }
fs2 = "0.4.3"
tauri-plugin-window-state = "2"
# cast-sender uses async-native-tls (system TLS: SChannel on Windows,
# Security.framework on macOS, OpenSSL on Linux). This is the only maintained
# Rust Chromecast crate that doesn't go through rustls — rustls's webpki parser
# rejects Chromecast's self-signed certs with UnsupportedCertVersion before any
# verifier runs, which makes rust_cast 0.19+ unusable against real devices.
cast-sender = "0.3"
mdns-sd = "0.19.1"
local-ip-address = "0.6.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-macos-haptics = "1.0.0"
objc2 = "0.6.4"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
strip = true
